name: Unclaimed Queue Check

# Alerts when a conversation sits in the human queue with nobody assigned.
# Escalations auto-assign, so anything reaching the threshold means either
# there were no active agents to give it to, or someone unassigned it by hand.
# Either way a customer is waiting and nobody owns it.
#
# Kept separate from Daily Sync because it runs on a much tighter cadence and
# shouldn't share that workflow's failure alerting or its 5-minute timeout.
on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 minutes
  workflow_dispatch:         # allow manual triggering from the UI

jobs:
  check-unclaimed:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check for unclaimed conversations
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://social-ai-backend-tult.onrender.com/api/cron/check-unclaimed" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "Status: $status"
          echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Unclaimed check returned $status"
            exit 1
          fi
