name: Daily Sync

# Schedule times are in UTC. EAT = UTC+3.
# So 3:00 AM EAT = 00:00 UTC, 3:15 AM EAT = 00:15 UTC, 3:45 AM EAT = 00:45 UTC.
# Cadence dropped from every 3 hours to once daily on 2026-08-12.
#
# The 3-hourly schedule was costing more than the freshness was worth. Each run
# pulls the ENTIRE id column of the table it syncs — ~162,000 customer ids and
# ~130,000 order ids — across the network purely to decide insert-vs-update.
# Eight runs a day of that put the Supabase egress allowance at 120% (6.02 GB
# against a 5 GB plan), which risks throttling.
#
# Once a day removes 7/8 of that traffic. Customer segments and order history do
# not move fast enough for three-hourly refreshes to change a decision anyone
# makes, and anything genuinely live already arrives by webhook.
#
# The real fix is to stop reading the id column at all (INSERT ... ON CONFLICT),
# which removes the reads rather than doing them less often. This buys headroom
# until then.
on:
  schedule:
    - cron: '0 0 * * *'      # daily 03:00 EAT — customers
    - cron: '5 0 * * *'      # daily 03:05 EAT — orders
    - cron: '10 0 * * *'     # daily 03:10 EAT — products
    - cron: '0 2 * * 0'    # Sunday 05:00 EAT — weekly reconcile
    - cron: '30 2 * * 0'   # Sunday 05:30 EAT — weekly FULL customer refresh
    - cron: '0 1 * * *'    # daily 04:00 EAT — conversion attribution
    - cron: '30 1 * * *'   # daily 04:30 EAT — auto-resolve stale conversations

  # Allow manual triggering from the GitHub UI for testing
  workflow_dispatch:
    inputs:
      sync_type:
        description: 'Which sync to run (products, customers, orders, or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - products
          - customers
          - orders
          - all
          - reconcile
          - customers-full
          - attribute
          - auto-resolve

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Determine which sync to run
        id: which
        run: |
          # GitHub Actions provides the schedule that triggered this run in github.event.schedule
          # For manual runs, use the workflow_dispatch input.
          SCHEDULE="${{ github.event.schedule }}"
          MANUAL_INPUT="${{ github.event.inputs.sync_type }}"

          if [ -n "$MANUAL_INPUT" ]; then
            echo "Manual run, sync_type=$MANUAL_INPUT"
            echo "sync=$MANUAL_INPUT" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 0 * * *" ]; then
            echo "Scheduled run for customers"
            echo "sync=customers" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "5 0 * * *" ]; then
            echo "Scheduled run for orders"
            echo "sync=orders" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "10 0 * * *" ]; then
            echo "Scheduled run for products"
            echo "sync=products" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 2 * * 0" ]; then
            echo "Scheduled run for reconcile"
            echo "sync=reconcile" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "30 2 * * 0" ]; then
            echo "Scheduled run for full customer refresh"
            echo "sync=customers-full" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "0 1 * * *" ]; then
            echo "Scheduled run for attribution"
            echo "sync=attribute" >> $GITHUB_OUTPUT
          elif [ "$SCHEDULE" = "30 1 * * *" ]; then
            echo "Scheduled run for auto-resolve"
            echo "sync=auto-resolve" >> $GITHUB_OUTPUT
          else
            echo "Unknown trigger, running nothing"
            echo "sync=none" >> $GITHUB_OUTPUT
          fi

      - name: Trigger products sync
        id: products_sync
        if: steps.which.outputs.sync == 'products' || steps.which.outputs.sync == 'all'
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://social-ai-backend-tult.onrender.com/api/cron/sync-products" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          echo "Status: $status"
          echo "Body: $body"
          echo "status=$status" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$body" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            echo "::error::Products sync failed with status $status"
            exit 1
          fi

      # If running "all" sequentially, wait between syncs
      - name: Wait before customers sync
        if: steps.which.outputs.sync == 'all'
        run: sleep 60

      - name: Trigger customers sync
        if: steps.which.outputs.sync == 'customers' || steps.which.outputs.sync == 'all'
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://social-ai-backend-tult.onrender.com/api/cron/sync-customers" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            echo "::error::Customers sync failed with status $status"
            exit 1
          fi

      - name: Wait before orders sync
        if: steps.which.outputs.sync == 'all'
        run: sleep 60

      - name: Trigger orders sync
        if: steps.which.outputs.sync == 'orders' || steps.which.outputs.sync == 'all'
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://social-ai-backend-tult.onrender.com/api/cron/sync-orders" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            echo "::error::Orders sync failed with status $status"
            exit 1
          fi

      # Full re-read of every customer, so cached_at stops ageing across the
      # whole table. Deliberately NOT part of 'all' — it is a heavy pass over
      # ~162,000 records and should run on its own schedule, not every time
      # somebody manually runs everything.
      - name: Trigger full customer refresh
        if: steps.which.outputs.sync == 'customers-full'
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://social-ai-backend-tult.onrender.com/api/cron/sync-customers?full=1" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            echo "::error::Full customer refresh failed with status $status"
            exit 1
          fi

      - name: Trigger reconcile
        if: steps.which.outputs.sync == 'reconcile'
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://social-ai-backend-tult.onrender.com/api/cron/reconcile" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")

          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')

          echo "Status: $status"
          echo "Body: $body"

          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            echo "::error::Reconcile failed with status $status"
            exit 1
          fi

      # Attribution reads orders, so on an 'all' run give the orders sync a
      # moment to land first.
      - name: Wait before attribution
        if: steps.which.outputs.sync == 'all'
        run: sleep 60

      # Included in 'all' as well as its own schedule. It wasn't, so a manual
      # "run all" quietly skipped the one job that writes conversion data —
      # the Conversion card would stay at zero however often you ran it.
      - name: Trigger attribution
        if: steps.which.outputs.sync == 'attribute' || steps.which.outputs.sync == 'all'
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://social-ai-backend-tult.onrender.com/api/cron/attribute" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "Status: $status"; echo "Body: $body"
          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            echo "::error::Attribution failed with status $status"; exit 1
          fi

      # Closes conversations that have gone quiet. Not part of 'all' — it
      # mutates conversation state, so it only runs on its own schedule or a
      # deliberate manual choice.
      - name: Trigger auto-resolve
        if: steps.which.outputs.sync == 'auto-resolve'
        run: |
          response=$(curl -sS -w "\nHTTP_STATUS:%{http_code}" -X POST \
            "https://social-ai-backend-tult.onrender.com/api/cron/auto-resolve" \
            -H "X-Cron-Secret: ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json")
          status=$(echo "$response" | grep "HTTP_STATUS:" | cut -d: -f2)
          body=$(echo "$response" | sed '/HTTP_STATUS:/d')
          echo "Status: $status"; echo "Body: $body"
          if [ "$status" != "200" ]; then
            echo "::error::Auto-resolve failed with status $status"; exit 1
          fi

      - name: Discord alert on failure
        if: failure()
        run: |
          # Pick the sync that's actually being run for the message
          SYNC_TYPE="${{ steps.which.outputs.sync }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -sS -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"username\": \"Sync Alerts\",
              \"embeds\": [{
                \"title\": \"🔴 Daily Sync Failed\",
                \"description\": \"Cron job for **${SYNC_TYPE}** sync failed to trigger or complete.\",
                \"color\": 15158332,
                \"fields\": [
                  {\"name\": \"Sync type\", \"value\": \"${SYNC_TYPE}\", \"inline\": true},
                  {\"name\": \"Time (UTC)\", \"value\": \"$(date -u +'%Y-%m-%d %H:%M')\", \"inline\": true}
                ],
                \"footer\": {\"text\": \"GitHub Actions\"},
                \"url\": \"${RUN_URL}\"
              }]
            }"
